name: 슬랙 메시지 삭제 (일회용)

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: 메시지 삭제
        env:
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          RES=$(curl -s -X POST https://slack.com/api/chat.delete -H "Authorization: Bearer $TOKEN" -d channel=C01J9V0N1LH -d ts=1791975232.060749)
          echo "$RES" | python3 -c 'import json,sys; r=json.load(sys.stdin); print("결과:", "성공" if r.get("ok") else "실패", r.get("error", ""))'
          echo "$RES" | grep -q '"ok":true'
