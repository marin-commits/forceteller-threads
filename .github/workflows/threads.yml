name: Threads 자동 발행

on:
  schedule:
    # 정규 발행은 Supabase Cron(threads-post-2100-kst)이 매일 21:00 KST에 실행 신호를 보냄
    # 아래는 그게 실패했을 때를 대비한 보험 (23:55 KST). 이미 올라가 있으면 조용히 건너뜀
    - cron: "55 14 * * *"
    - cron: "0 3 1 * *"     # 매월 1일 한국시간 정오: 토큰 연장
  workflow_dispatch:         # 수동 실행 버튼 (테스트용)
    inputs:
      mode:
        description: "실행할 작업"
        type: choice
        options: [post, refresh]
        default: post

jobs:
  run:
    runs-on: ubuntu-latest
    # 밀린 실행이 한꺼번에 돌아도 동시에 올리지 않도록 한 번에 하나씩만 실행
    concurrency:
      group: threads-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 무슨 작업인지 정하기
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 3 1 * *" ]; then
            echo "MODE=refresh" >> $GITHUB_ENV
          else
            echo "MODE=post" >> $GITHUB_ENV
          fi

      - name: 실행
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          DAYS_AHEAD: "1"   # 1 = 내일 운세 / 0 = 오늘 운세 (아침 발행으로 바꿀 때 0으로)
        run: python threads_bot.py "$MODE"

      - name: 새 토큰이 나왔으면 Secrets에 저장
        if: env.NEW_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set THREADS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"

      - name: 슬랙 알림 (운세 발행 성공/실패만, 건너뜀·토큰 연장은 알림 없음)
        if: always() && env.MODE != 'refresh' && env.SKIPPED != '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "슬랙 주소가 없어서 알림 생략"; exit 0; fi
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
          else
            ICON="🚨"
            if [ "$MODE" = "refresh" ]; then DEFAULT_MSG="스레드 토큰 연장 실패"; else DEFAULT_MSG="스레드 오늘의 운세 업로드 실패"; fi
            RESULT_MSG="${RESULT_MSG:-$DEFAULT_MSG}"
          fi
          export TEXT="$ICON $RESULT_MSG"
          python3 -c 'import json,os,urllib.request; urllib.request.urlopen(urllib.request.Request(os.environ["SLACK_WEBHOOK_URL"], data=json.dumps({"text": os.environ["TEXT"]}).encode(), headers={"Content-Type": "application/json"}))'
